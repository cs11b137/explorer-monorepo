name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: cs-explorer
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cloudflare Pages 上站点在根路径，不设 BASE_PATH，Protocol 镜像逐字节原样提供。
      - name: Build
        run: npm run build

      # 项目名决定 pages.dev 子域名，项目创建后不能改名。
      - name: Create project if missing
        run: |
          npx --yes wrangler@4 pages project list | grep -qw "$PROJECT" \
            || npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main

      - name: Deploy
        run: npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT" --branch=main
